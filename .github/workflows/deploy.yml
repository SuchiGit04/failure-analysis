name: Deploy Failure Analysis App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy on Windows server
      shell: powershell
      run: |
        $sourcePath = "$env:GITHUB_WORKSPACE"
        $deployPath = "C:\Users\Administrator\Documents\Failure Analysis"
        
        Write-Host "📁 Source: $sourcePath"
        Write-Host "📂 Deploy Path: $deployPath"
        
        # Ensure target folder exists
        if (-not (Test-Path $deployPath)) {
            New-Item -ItemType Directory -Path $deployPath | Out-Null
        }
        
        # Copy latest code to deployment folder
        Write-Host "Copying files..."
        robocopy $sourcePath $deployPath /MIR /XF venv /XD .git
        
        # Navigate to project folder
        Set-Location $deployPath
        
        # Create virtual environment if missing
        if (-not (Test-Path "$deployPath\venv")) {
            python -m venv venv
        }
        
        # Install/update dependencies
        & "$deployPath\venv\Scripts\python.exe" -m pip install --upgrade pip
        & "$deployPath\venv\Scripts\python.exe" -m pip install -r requirements.txt
        
        # Stop only the previous instance
        $flaskProcess = Get-Process python -ErrorAction SilentlyContinue | Where-Object {
            $_.Path -eq "$deployPath\venv\Scripts\python.exe"
        }
        if ($flaskProcess) {
            Write-Host "Stopping previous instance..."
            $flaskProcess | Stop-Process -Force
        }
        
        # Start the Flask app in background
        Write-Host "Starting Failure Analysis..."
        Start-Process -FilePath "$deployPath\venv\Scripts\python.exe" -ArgumentList "$deployPath\app.py" -WorkingDirectory $deployPath
